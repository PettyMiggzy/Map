<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NOMO // PUMP RUN</title>
<style>
:root{
  --lime:#C6FF00; --lime-dim:#8FBF00; --lime-glow:rgba(198,255,0,.35);
  --black:#060806; --panel:#0d110c; --red:#FF3B3B; --green:#00E676;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--black);overflow:hidden}
body{font-family:var(--mono);color:var(--lime);display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none;}
#wrap{position:relative;width:100%;height:100%;max-width:1400px;overflow:hidden;background:var(--black);cursor:pointer}
canvas{display:block;width:100%;height:100%}
#crt{position:absolute;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.5}
#vig{position:absolute;inset:0;pointer-events:none;z-index:39;
  background:radial-gradient(ellipse at center,transparent 46%,rgba(0,0,0,.7) 100%)}
.br{position:absolute;width:34px;height:34px;border:2px solid var(--lime);opacity:.4;z-index:41;pointer-events:none}
.br.tl{top:8px;left:8px;border-right:0;border-bottom:0}
.br.trr{top:8px;right:8px;border-left:0;border-bottom:0}
.br.bl{bottom:8px;left:8px;border-right:0;border-top:0}
.br.brr{bottom:8px;right:8px;border-left:0;border-top:0}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:45}
.hud-tl{position:absolute;top:14px;left:16px;font-size:11px;letter-spacing:.09em}
.hud-tr{position:absolute;top:14px;right:16px;text-align:right;font-size:11px;letter-spacing:.09em}
.lbl{color:var(--lime-dim);opacity:.75;font-size:9px;display:block;margin-bottom:3px}
.val{font-size:15px;font-weight:700;text-shadow:0 0 12px var(--lime-glow)}
#pumpwrap{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:min(340px,62%);text-align:center}
#pumpnum{font-size:22px;font-weight:700;text-shadow:0 0 16px var(--lime-glow);letter-spacing:.04em}
#pumpnum small{font-size:10px;opacity:.55;font-weight:400}
#combo{font-size:11px;color:var(--green);margin-top:3px;height:13px;opacity:0;transition:opacity .15s}
.sndbtn{pointer-events:auto;margin-top:11px;display:inline-block;font-family:var(--mono);font-size:9px;
  letter-spacing:.13em;background:rgba(13,17,12,.9);color:var(--lime);border:1px solid rgba(198,255,0,.35);
  padding:5px 9px;cursor:pointer}
.sndbtn.off{color:#5d6b4a;border-color:rgba(198,255,0,.16)}
/* overlay */
#ov{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(6,8,6,.82),rgba(6,8,6,.96));backdrop-filter:blur(3px)}
#ov.hide{display:none}
.card{width:min(430px,90%);border:1px solid rgba(198,255,0,.35);background:var(--panel);
  padding:24px;text-align:center;position:relative;box-shadow:0 0 44px rgba(198,255,0,.09),inset 0 0 60px rgba(198,255,0,.03)}
.card:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--lime-dim),var(--lime),var(--lime-dim))}
.eyebrow{font-size:9px;letter-spacing:.3em;color:var(--lime-dim);opacity:.8;margin-bottom:9px}
h1{font-size:30px;letter-spacing:.1em;margin-bottom:6px;text-shadow:0 0 22px var(--lime-glow)}
h1.small{font-size:22px}
.sub{font-size:11px;color:var(--lime-dim);opacity:.9;line-height:1.7;margin-bottom:18px}
.mg{width:118px;height:auto;margin:2px auto 10px;display:block;filter:drop-shadow(0 0 16px rgba(198,255,0,.55))}
button{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.16em;padding:13px 34px;
  background:var(--lime);color:var(--black);border:0;cursor:pointer;transition:.15s;box-shadow:0 0 22px rgba(198,255,0,.3)}
button:hover{background:#fff;box-shadow:0 0 32px rgba(198,255,0,.55)}
button:active{transform:translateY(1px)}
.statrow{display:flex;gap:11px;margin-bottom:18px}
.stat{flex:1;border:1px solid rgba(198,255,0,.18);padding:11px 5px;background:rgba(198,255,0,.03)}
.stat .n{font-size:20px;font-weight:700;display:block;margin-bottom:2px}
.stat .k{font-size:8px;color:var(--lime-dim);opacity:.75;letter-spacing:.12em}
.stat.warn .n{color:var(--red)}
.hint{font-size:10px;color:var(--lime-dim);opacity:.75;margin-top:4px;letter-spacing:.1em}
@media (max-width:760px){h1{font-size:24px}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="vig"></div>
  <div id="crt"></div>
  <div class="br tl"></div><div class="br trr"></div><div class="br bl"></div><div class="br brr"></div>
  <div id="hud">
    <div class="hud-tl"><span class="lbl">TICKER</span><span class="val">$NOMO</span>
      <button id="sndbtn" class="sndbtn" type="button">&#9834; SOUND ON</button></div>
    <div class="hud-tr"><span class="lbl">RECORD LOW</span><span class="val" id="best">10,000</span></div>
    <div id="pumpwrap"><div id="pumpnum">0 <small>PUMPS</small></div><div id="combo"></div></div>
  </div>
  <div id="ov"><div class="card" id="card"></div></div>
</div>
<script>
(function(){
"use strict";

/* ---------------- CONFIG ---------------- */
const CFG = {
  GRAV: 1750,        // px/s^2
  FLAP: -560,        // px/s impulse
  MAXFALL: 780,
  GAP: 250,          // vertical gap between candle walls (scaled by height)
  SPACING: 360,      // horizontal px between gates
  SPEED: 250,        // starting scroll speed px/s
  SPEED_MAX: 460,
  SPEED_RAMP: 3.2,   // speed gained per gate passed
  CANDLE_W: 74,
  GNOME: 74
};

/* ---------------- AUDIO (synth, no files) ---------------- */
const Snd=(function(){
  let ac=null,master=null,noiseBuf=null,ready=false,muted=false;
  function init(){ if(ready)return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    try{ ac=new AC(); master=ac.createGain(); master.gain.value=.3; master.connect(ac.destination);
      const n=Math.floor(ac.sampleRate*.4); noiseBuf=ac.createBuffer(1,n,ac.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<n;i++)d[i]=Math.random()*2-1; ready=true; }catch(e){ready=false;} }
  function resume(){ try{ if(ac&&ac.state==='suspended')ac.resume(); }catch(e){} }
  function live(){ return ready&&!muted&&ac; }
  function tone(o){ if(!live())return; try{ const t0=ac.currentTime+(o.delay||0); const osc=ac.createOscillator(),g=ac.createGain();
    osc.type=o.type||'sine'; osc.frequency.setValueAtTime(o.f,t0); if(o.to)osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.to),t0+o.dur);
    const v=o.v==null?.3:o.v; g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+(o.atk||.005));
    g.gain.exponentialRampToValueAtTime(.0001,t0+o.dur); osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0+o.dur+.02);}catch(e){} }
  function noise(o){ if(!live())return; try{ const t0=ac.currentTime+(o.delay||0); const s=ac.createBufferSource(); s.buffer=noiseBuf;
    const f=ac.createBiquadFilter(); f.type=o.ftype||'bandpass'; f.frequency.setValueAtTime(o.f||800,t0);
    if(o.to)f.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t0+o.dur); f.Q.value=o.q==null?1:o.q;
    const g=ac.createGain(); const v=o.v==null?.3:o.v; g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+.004);
    g.gain.exponentialRampToValueAtTime(.0001,t0+o.dur); s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0+o.dur+.02);}catch(e){} }
  return { init,resume, toggle(){muted=!muted;return muted;}, isMuted(){return muted;},
    flap(){ tone({f:420,to:680,dur:.09,type:'square',v:.14}); noise({f:600,dur:.04,v:.04,q:1.4}); },
    score(){ tone({f:720,to:1080,dur:.1,type:'triangle',v:.18}); tone({f:1440,dur:.05,type:'sine',v:.06,delay:.03}); },
    coin(){ [660,880,1170].forEach((f,i)=>tone({f:f,dur:.13,type:'square',v:.12,delay:i*.04})); },
    mult(){ tone({f:880,dur:.09,type:'triangle',v:.15}); tone({f:1320,dur:.12,type:'triangle',v:.15,delay:.07}); },
    die(){ tone({f:300,to:44,dur:.7,type:'sawtooth',v:.26,to2:0}); noise({f:1600,to:120,dur:.5,v:.18,q:.6});
           tone({f:90,to:36,dur:.6,type:'square',v:.16,delay:.05}); },
    best(){ [523,659,784,1046,1319].forEach((f,i)=>tone({f:f,dur:.4,type:'triangle',v:.16,delay:i*.09})); } };
})();

/* ---------------- STATE ---------------- */
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
let DPR=Math.min(window.devicePixelRatio||1,2), VW=0, VH=0;
let state='menu', score=0, supply=10000, best=+(localStorage.getItem('nomo_scarcity')||10000);
let gnome={x:0,y:0,vy:0,rot:0}, gates=[], coins=[], parts=[], bgc=[];
let speed=CFG.SPEED, dist=0, spawnX=0, combo=0, mult=1, shake=0, flashCol=null, flashA=0;
let lastT=0, price=0.01;

function resize(){ const r=cv.getBoundingClientRect(); VW=Math.round(r.width); VH=Math.round(r.height);
  DPR=Math.min(window.devicePixelRatio||1,2); cv.width=VW*DPR; cv.height=VH*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  gnome.x=Math.max(90,VW*0.28); }
addEventListener('resize',resize);

function gap(){ return Math.max(180, Math.min(CFG.GAP, VH*0.34)); }

function reset(){ score=0; speed=CFG.SPEED; dist=0; combo=0; mult=1; shake=0; flashA=0; price=0.01;
  gnome.y=VH*0.45; gnome.vy=0; gnome.rot=0; gates=[]; coins=[]; parts=[]; supply=10000;
  spawnX=VW+120; for(let i=0;i<4;i++){ spawnGate(spawnX); spawnX+=CFG.SPACING; }
  updHUD(); }

function spawnGate(x){ const g=gap(); const margin=70;
  const cy=margin+g/2 + Math.random()*(VH-2*margin-g);
  gates.push({x:x, cy:cy, g:g, passed:false});
  // sometimes a green candle in the gap to grab
  if(Math.random()<0.62) coins.push({x:x, y:cy + (Math.random()-0.5)*(g-70), got:false, bob:Math.random()*6});
}

function flap(){ if(state!=='play') return; gnome.vy=CFG.FLAP; Snd.flap();
  for(let i=0;i<6;i++){ parts.push({x:gnome.x-16,y:gnome.y+14,vx:-60-Math.random()*90,vy:40+Math.random()*80,life:.5,col:'#C6FF00',sz:2+Math.random()*3}); } }

/* input */
function press(e){ Snd.resume();
  if(state==='menu'||state==='over'){ if(e&&e.type==='keydown'&&!(e.code==='Space'||e.code==='Enter'))return; start(); return; }
  flap(); }
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Enter'){ e.preventDefault(); press(e);} });
document.getElementById('wrap').addEventListener('pointerdown',e=>{ if(e.target.closest('button'))return; press(e); });

/* ---------------- UPDATE ---------------- */
function update(dt){
  if(state!=='play'){ // idle bob on menu
    gnome.y = VH*0.45 + Math.sin(performance.now()*.003)*10; return;
  }
  // gnome physics
  gnome.vy = Math.min(CFG.MAXFALL, gnome.vy + CFG.GRAV*dt);
  gnome.y += gnome.vy*dt;
  gnome.rot = Math.max(-0.5, Math.min(1.1, gnome.vy/700));
  // floor / ceiling
  if(gnome.y > VH-40){ gnome.y=VH-40; return die(); }
  if(gnome.y < 20){ gnome.y=20; gnome.vy=0; }

  speed = Math.min(CFG.SPEED_MAX, speed);
  const dx = speed*dt;
  dist += dx;

  // gates
  for(const gt of gates){
    gt.x -= dx;
    if(!gt.passed && gt.x + CFG.CANDLE_W/2 < gnome.x){ gt.passed=true; score++; speed+=CFG.SPEED_RAMP;
      const burn=90+score*10; supply=Math.max(1, supply-burn);
      price = +(0.01*10000/supply).toFixed(2);
      Snd.score(); floatTxt(gnome.x+18, gnome.y-26, '-'+burn+' BURNED', '#FF7A3C');
      if(supply<=1){ return win(); } }
    // collision
    if(Math.abs(gt.x - gnome.x) < CFG.CANDLE_W/2 + CFG.GNOME*0.30){
      const half=gt.g/2, r=CFG.GNOME*0.30;
      if(gnome.y - r < gt.cy-half || gnome.y + r > gt.cy+half){ return die(); }
    }
  }
  // recycle + spawn
  if(gates.length && gates[0].x < -CFG.CANDLE_W){ gates.shift(); }
  const lastX = gates.length? gates[gates.length-1].x : 0;
  if(lastX < VW + 40){ spawnGate(lastX + CFG.SPACING); }

  // coins
  for(const c of coins){ c.x -= dx;
    if(!c.got && Math.hypot(c.x-gnome.x, c.y-gnome.y) < 34){ c.got=true; combo++; mult=Math.min(5,1+Math.floor(combo/3));
      const add=40*mult; supply=Math.max(1, supply-add); price=+(0.01*10000/supply).toFixed(2); var sWin=supply<=1;
      Snd.coin(); if(combo%3===0){ Snd.mult(); showCombo(); }
      for(let i=0;i<12;i++)parts.push({x:c.x,y:c.y,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220-40,life:.7,col:'#00E676',sz:2+Math.random()*3});
      floatTxt(c.x,c.y,'-'+add+' BURN'+(mult>1?' x'+mult:''),'#00E676'); if(sWin){ return win(); } }
  }
  for(let i=coins.length-1;i>=0;i--){ if(coins[i].x<-40||coins[i].got&&coins[i].x<gnome.x-60) coins.splice(i,1); }

  // fx
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=900*dt; p.life-=dt; if(p.life<=0)parts.splice(i,1); }
  if(shake>0) shake=Math.max(0,shake-dt*60);
  if(flashA>0) flashA=Math.max(0,flashA-dt*1.8);
  updHUD();
}

let floaters=[];
function floatTxt(x,y,txt,col){ floaters.push({x,y,txt,col,life:1}); }
function popScore(){ // little pump kick
  price=price; }
function win(){ if(state!=='play')return; state='win'; supply=1; price=+(0.01*10000/1).toFixed(2); Snd.best(); flashCol='#C6FF00'; flashA=.8; shake=14;
  if(supply<best){ best=supply; localStorage.setItem('nomo_scarcity',best); }
  for(let i=0;i<70;i++)parts.push({x:gnome.x,y:gnome.y,vx:(Math.random()-.5)*520,vy:(Math.random()-.5)*520,life:1.1,col:i%2?'#C6FF00':'#00E676',sz:2+Math.random()*4});
  updHUD(); setTimeout(()=>winCard(),560); }
function die(){ if(state!=='play')return; state='over'; Snd.die(); shake=22; flashCol='#FF3B3B'; flashA=.6;
  for(let i=0;i<40;i++)parts.push({x:gnome.x,y:gnome.y,vx:(Math.random()-.5)*400,vy:(Math.random()-.5)*400,life:1,col:i%2?'#FF3B3B':'#C6FF00',sz:2+Math.random()*4});
  if(supply<best){ best=supply; localStorage.setItem('nomo_scarcity',best); }
  setTimeout(()=>endCard(),520); }

/* ---------------- RENDER ---------------- */
function drawBG(){
  // scrolling faint green candlestick chart backdrop (parallax)
  ctx.fillStyle='#070d07'; ctx.fillRect(0,0,VW,VH);
  const cw=26, off=(dist*0.25)%cw;
  ctx.globalAlpha=.5;
  let y=VH*0.7;
  for(let i=-1;i*cw < VW+cw;i++){
    const x=i*cw-off; const h=((Math.sin(i*0.7+Math.floor(dist/ (cw*4)) )*0.5+0.5)*VH*0.34)+20;
    const up=Math.sin(i*1.3)>0; y += (up?-1:1)*8;
    ctx.strokeStyle='rgba(0,230,118,.18)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x+cw/2,y-h*0.6); ctx.lineTo(x+cw/2,y+h*0.6); ctx.stroke();
    ctx.fillStyle= up?'rgba(0,230,118,.14)':'rgba(255,59,59,.10)';
    ctx.fillRect(x+4,y-h*0.3,cw-8,h*0.6);
  }
  ctx.globalAlpha=1;
  // rising trend line
  ctx.strokeStyle='rgba(198,255,0,.10)'; ctx.lineWidth=2; ctx.beginPath();
  for(let x=0;x<=VW;x+=20){ const yy=VH*0.8 - (x/VW)*VH*0.3 + Math.sin(x*0.02+dist*0.01)*8; if(x===0)ctx.moveTo(x,yy); else ctx.lineTo(x,yy);} ctx.stroke();
}
function drawCandle(x,topY,botY,w){
  // red resistance wall candle (body + wick), glowing
  ctx.save();
  ctx.shadowColor='rgba(255,59,59,.5)'; ctx.shadowBlur=16;
  ctx.fillStyle='#FF3B3B';
  ctx.fillRect(x-w/2, topY, w, botY-topY);
  ctx.shadowBlur=0;
  // inner shading
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.fillRect(x-w/2, topY, w, botY-topY);
  ctx.fillStyle='#FF3B3B'; ctx.fillRect(x-w/2, topY, w, botY-topY);
  ctx.fillStyle='rgba(255,255,255,.14)'; ctx.fillRect(x-w/2, topY, 4, botY-topY);
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(x+w/2-4, topY, 4, botY-topY);
  // wick
  ctx.strokeStyle='#FF6B6B'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x, topY); ctx.lineTo(x, topY-16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, botY); ctx.lineTo(x, botY+16); ctx.stroke();
  ctx.restore();
}
function drawGreenCandle(x,y,t){
  ctx.save(); ctx.translate(x,y+Math.sin(t*0.004+x*0.05)*3);
  const h=30,w=15; ctx.shadowColor='#00E676'; ctx.shadowBlur=13; ctx.strokeStyle='#00E676'; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(0,-h*0.9); ctx.lineTo(0,h*0.9); ctx.stroke();
  ctx.fillStyle='#00E676'; ctx.fillRect(-w/2,-h*0.5,w,h); ctx.shadowBlur=0;
  ctx.fillStyle='#00532a'; ctx.font='bold 13px '+'ui-monospace,monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('▲',0,0); ctx.restore();
}
function drawGnome(){
  const T=CFG.GNOME;
  ctx.save(); ctx.translate(gnome.x, gnome.y); ctx.rotate(gnome.rot);
  // lime jet trail glow
  ctx.shadowColor='rgba(198,255,0,.5)'; ctx.shadowBlur=18;
  if(nready && NIMG.complete && NIMG.naturalHeight){
    const H=T, W=H*(NIMG.naturalWidth/NIMG.naturalHeight);
    ctx.imageSmoothingEnabled=true; ctx.drawImage(NIMG, -W/2, -H/2, W, H);
  } else { ctx.fillStyle='#9ADB0E'; ctx.beginPath(); ctx.arc(0,0,T*0.35,0,7); ctx.fill(); }
  ctx.restore();
}
function draw(){
  const sx=shake>0?(Math.random()-.5)*shake:0, sy=shake>0?(Math.random()-.5)*shake:0;
  ctx.clearRect(0,0,VW,VH);
  ctx.save(); ctx.translate(sx,sy);
  drawBG();
  const t=performance.now();
  for(const gt of gates){ const half=gt.g/2; drawCandle(gt.x, -20, gt.cy-half, CFG.CANDLE_W);
    drawCandle(gt.x, gt.cy+half, VH+20, CFG.CANDLE_W); }
  for(const c of coins){ if(!c.got) drawGreenCandle(c.x,c.y,t); }
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col; ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz); }
  ctx.globalAlpha=1;
  drawGnome();
  for(let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.y-=0.6; f.life-=0.02; if(f.life<=0){floaters.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,f.life); ctx.fillStyle=f.col; ctx.font='bold 15px ui-monospace,monospace'; ctx.textAlign='center';
    ctx.shadowColor=f.col; ctx.shadowBlur=10; ctx.fillText(f.txt,f.x,f.y); ctx.shadowBlur=0; }
  ctx.globalAlpha=1;
  ctx.restore();
  if(flashA>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flashA; ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1; }
}

/* ---------------- HUD / SCREENS ---------------- */
const el={ pump:document.getElementById('pumpnum'), best:document.getElementById('best'),
  combo:document.getElementById('combo'), ov:document.getElementById('ov'), card:document.getElementById('card') };
let comboTimer=0;
function showCombo(){ el.combo.textContent='COMBO x'+mult+' ↗'; el.combo.style.opacity='1'; comboTimer=60; }
function updHUD(){ el.pump.innerHTML=supply.toLocaleString()+' <small>&#47;10,000 SUPPLY &middot; $'+price.toFixed(2)+'</small>'; el.best.textContent=best.toLocaleString();
  if(comboTimer>0){ comboTimer--; if(comboTimer<=0)el.combo.style.opacity='0'; } }

const sndBtn=document.getElementById('sndbtn');
function syncSnd(){ const m=Snd.isMuted(); sndBtn.textContent=(m?'♪ SOUND OFF':'♪ SOUND ON'); sndBtn.classList.toggle('off',m); }
sndBtn.addEventListener('click',e=>{ e.stopPropagation(); Snd.init(); Snd.resume(); const m=Snd.toggle(); if(!m)Snd.flap(); syncSnd(); });

    '<h1>BURN TO 1</h1><div class="sub">NOMO is the <b>10,000</b>-supply gnome. Every buy &amp; sell <b style="color:#FF7A3C">BURNS</b> supply forever. '+
    'Fly the pump, thread the <span style="color:#FF3B3B">red candles</span>, grab <span style="color:#00E676">green candles</span> to burn faster. '+
    'Torch all 10,000 down to the last one &mdash; because <b style="color:#C6FF00">you just need 1 $NOMO</b>.<br>Hit a red candle and you get <b style="color:#FF3B3B">dumped</b>.</div>'+
    '<button id="go">START BURNING</button><div class="hint">SPACE / CLICK / TAP</div>';
  document.getElementById('go').onclick=start; const mg=document.getElementById('mg'); if(mg&&NIMG.src)mg.src=NIMG.src; }
function endCard(){ el.ov.classList.remove('hide'); const rec = supply<=best;
  el.card.innerHTML='<div class="eyebrow">'+(rec?'NEW SCARCITY RECORD':'RUG PULLED')+'</div>'+
    '<h1 class="small">DUMPED</h1>'+
    '<div class="sub" style="margin-bottom:14px">You burned it down to <b style="color:#C6FF00">'+supply.toLocaleString()+'</b>. '+(supply<=1000?'So close to just 1.':'Keep burning.')+'</div>'+
    '<div class="statrow"><div class="stat"><span class="n">'+supply.toLocaleString()+'</span><span class="k">SUPPLY LEFT</span></div>'+
    '<div class="stat"><span class="n">$'+price.toFixed(2)+'</span><span class="k">PRICE</span></div>'+
    '<div class="stat"><span class="n">'+best.toLocaleString()+'</span><span class="k">RECORD LOW</span></div></div>'+
    '<button id="go">BURN AGAIN</button><div class="hint">SPACE / CLICK / TAP</div>';
  document.getElementById('go').onclick=start; }
function winCard(){ el.ov.classList.remove('hide');
  el.card.innerHTML='<img class="mg" id="mgw" alt=""><div class="eyebrow">MAXIMUM SCARCITY</div>'+
    '<h1 class="small" style="color:#C6FF00">YOU JUST NEED 1</h1>'+
    '<div class="sub">You burned all 10,000 down to the last <b style="color:#C6FF00">$NOMO</b>. Last gnome standing. Diamond hands.</div>'+
    '<div class="statrow"><div class="stat"><span class="n" style="color:#C6FF00">1</span><span class="k">SUPPLY LEFT</span></div>'+
    '<div class="stat"><span class="n">$'+price.toFixed(2)+'</span><span class="k">PRICE</span></div></div>'+
    '<button id="go">RUN IT BACK</button><div class="hint">SPACE / CLICK / TAP</div>';
  document.getElementById('go').onclick=start; var mg=document.getElementById('mgw'); if(mg&&NIMG.src)mg.src=NIMG.src; }
function start(){ Snd.init(); Snd.resume(); Snd.flap(); syncSnd(); el.ov.classList.add('hide'); reset(); state='play'; gnome.vy=CFG.FLAP*0.6; }

/* ---------------- LOOP ---------------- */
function frame(now){ const dt=Math.min(0.033,(now-(lastT||now))/1000); lastT=now; update(dt); draw(); requestAnimationFrame(frame); }
resize(); reset(); menu(); requestAnimationFrame(frame);
})();
</script>
