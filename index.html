<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NOMO // SUBLEVEL DIG</title>
<style>
/* ============================================================
   NOMO // SUBLEVEL DIG
   Single-file HTML5 game. Drop anywhere on nomosupply.com.
   Brand palette pulled from nomosupply.com
   ============================================================ */
:root{
  --lime:#C6FF00;
  --lime-dim:#8FBF00;
  --lime-glow:rgba(198,255,0,.35);
  --black:#060806;
  --panel:#0d110c;
  --olive:#34402E;
  --red:#FF3B3B;
  --green:#00E676;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--black);overflow:hidden}
body{
  font-family:var(--mono);
  color:var(--lime);
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
  touch-action:none;
}
#wrap{
  position:relative;width:100%;height:100%;max-width:1400px;
  overflow:hidden;background:var(--black);
}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}

/* ---------- scanline / CRT overlay to match site ---------- */
#crt{
  position:absolute;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.55;
}
#vig{
  position:absolute;inset:0;pointer-events:none;z-index:39;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%);
}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:45;font-size:11px;letter-spacing:.09em}
.hud-tl{position:absolute;top:14px;left:16px}
.hud-tr{position:absolute;top:14px;right:16px;text-align:right}
.hud-bc{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:min(760px,94%)}
.lbl{color:var(--lime-dim);opacity:.75;font-size:9px;display:block;margin-bottom:3px}
.val{font-size:15px;font-weight:700;text-shadow:0 0 12px var(--lime-glow)}

/* sound toggle — must opt back into pointer events, #hud ignores them */
.sndbtn{
  pointer-events:auto;margin-top:11px;display:block;
  font-family:var(--mono);font-size:9px;font-weight:400;letter-spacing:.13em;
  background:rgba(13,17,12,.9);color:var(--lime);
  border:1px solid rgba(198,255,0,.35);padding:5px 9px;
  cursor:pointer;box-shadow:none;transition:background .15s,color .15s;
}
.sndbtn:hover{background:rgba(198,255,0,.16);color:var(--lime);box-shadow:none}
.sndbtn:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.sndbtn.off{color:#5d6b4a;border-color:rgba(198,255,0,.16)}

/* balance bar */
#balwrap{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:min(340px,52%);text-align:center;
}
#balnum{font-size:19px;font-weight:700;text-shadow:0 0 16px var(--lime-glow);letter-spacing:.05em}
#balnum small{font-size:10px;opacity:.5;font-weight:400}
#baltrack{
  height:4px;background:rgba(198,255,0,.12);margin-top:6px;
  border:1px solid rgba(198,255,0,.2);position:relative;overflow:hidden;
}
#balfill{
  height:100%;width:0%;background:linear-gradient(90deg,var(--olive),var(--lime));
  box-shadow:0 0 10px var(--lime-glow);transition:width .25s ease;
}

/* status strip (mirrors the site's SCAN/DIAL/BOLTS row) */
#strip{display:flex;gap:1px;background:rgba(198,255,0,.14);border:1px solid rgba(198,255,0,.2)}
.cell{
  flex:1;background:var(--panel);padding:7px 9px;display:flex;
  align-items:center;gap:7px;justify-content:center;font-size:9px;
  color:var(--lime-dim);white-space:nowrap;overflow:hidden;
}
.dot{width:5px;height:5px;border-radius:50%;background:var(--olive);flex:none}
.cell.on{color:var(--lime)}
.cell.on .dot{background:var(--lime);box-shadow:0 0 7px var(--lime)}
.cell.bad{color:var(--red)}
.cell.bad .dot{background:var(--red);box-shadow:0 0 7px var(--red)}
.cell b{color:inherit;font-weight:700}

/* corner brackets */
.br{position:absolute;width:34px;height:34px;border:2px solid var(--lime);opacity:.45}
.br.tl{top:8px;left:8px;border-right:0;border-bottom:0}
.br.trr{top:8px;right:8px;border-left:0;border-bottom:0}
.br.bl{bottom:8px;left:8px;border-right:0;border-top:0}
.br.brr{bottom:8px;right:8px;border-left:0;border-top:0}

/* ---------- overlays ---------- */
#ov{
  position:absolute;inset:0;z-index:60;display:flex;
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(6,8,6,.86),rgba(6,8,6,.97));
  backdrop-filter:blur(3px);
}
#ov.hide{display:none}
.card{
  width:min(430px,90%);border:1px solid rgba(198,255,0,.35);background:var(--panel);
  padding:26px 24px;text-align:center;position:relative;
  box-shadow:0 0 44px rgba(198,255,0,.09),inset 0 0 60px rgba(198,255,0,.03);
}
.card:before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--olive),var(--lime),var(--olive));
}
.eyebrow{font-size:9px;letter-spacing:.3em;color:var(--lime-dim);opacity:.8;margin-bottom:9px}
h1{font-size:27px;letter-spacing:.13em;margin-bottom:5px;text-shadow:0 0 22px var(--lime-glow)}
h1.small{font-size:21px}
.sub{font-size:10px;color:var(--lime-dim);opacity:.85;line-height:1.75;margin-bottom:19px}
.keys{
  display:flex;gap:7px;justify-content:center;margin-bottom:19px;flex-wrap:wrap;
  font-size:9px;color:var(--lime-dim);
}
.key{border:1px solid rgba(198,255,0,.3);padding:5px 9px;background:rgba(198,255,0,.04)}
.key b{color:var(--lime);font-weight:700}
button{
  font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.17em;
  padding:12px 30px;background:var(--lime);color:var(--black);border:0;
  cursor:pointer;transition:.15s;box-shadow:0 0 22px rgba(198,255,0,.3);
}
button:hover{background:#fff;box-shadow:0 0 32px rgba(198,255,0,.55)}
button:active{transform:translateY(1px)}
.statrow{display:flex;gap:11px;margin-bottom:19px}
.stat{flex:1;border:1px solid rgba(198,255,0,.18);padding:10px 5px;background:rgba(198,255,0,.03)}
.stat .n{font-size:17px;font-weight:700;display:block;margin-bottom:2px}
.stat .k{font-size:8px;color:var(--lime-dim);opacity:.75;letter-spacing:.12em}
.warn{color:var(--red)}
.warn .n{color:var(--red)}

/* ---------- mobile dpad ---------- */
#pad{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);z-index:50;display:none}
#pad.on{display:block}
.pgrid{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:6px}
.pbtn{
  border:1px solid rgba(198,255,0,.35);background:rgba(13,17,12,.85);color:var(--lime);
  display:flex;align-items:center;justify-content:center;font-size:19px;
  pointer-events:auto;cursor:pointer;
}
.pbtn:active{background:rgba(198,255,0,.22)}
.pbtn.empty{border:0;background:none;pointer-events:none}
@media (max-width:760px){
  .hud-tl,.hud-tr{font-size:9px}
  h1{font-size:21px}
  #balwrap{width:70%}
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="br tl"></div><div class="br trr"></div>
    <div class="br bl"></div><div class="br brr"></div>

    <div class="hud-tl">
      <span class="lbl">SECTOR</span>
      <span class="val" id="sector">GN-10</span>
      <button id="sndbtn" class="sndbtn" type="button" aria-pressed="false">♪ SOUND ON</button>
    </div>

    <div id="balwrap">
      <div id="balnum">0 <small>/ 10,000 $NOMO</small></div>
      <div id="baltrack"><div id="balfill"></div></div>
    </div>

    <div class="hud-tr">
      <span class="lbl">DEPTH</span>
      <span class="val" id="depth">0m</span>
    </div>

    <div class="hud-bc">
      <div id="strip">
        <div class="cell on" id="c-lvl"><span class="dot"></span><b>TOPSOIL</b></div>
        <div class="cell" id="c-streak"><span class="dot"></span>STREAK <b>0x</b></div>
        <div class="cell" id="c-risk"><span class="dot"></span>RISK <b>LOW</b></div>
        <div class="cell" id="c-pick"><span class="dot"></span>PICK <b>MK-I</b></div>
      </div>
    </div>
  </div>

  <div id="pad">
    <div class="pgrid">
      <div class="pbtn empty"></div>
      <div class="pbtn" data-d="up">▲</div>
      <div class="pbtn empty"></div>
      <div class="pbtn" data-d="left">◀</div>
      <div class="pbtn" data-d="down">▼</div>
      <div class="pbtn" data-d="right">▶</div>
    </div>
  </div>

  <div id="vig"></div>
  <div id="crt"></div>

  <div id="ov">
    <div class="card" id="card"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   CONFIG  — tune the game here
   ============================================================ */
const CFG = {
  TILE: 44,               // recomputed on resize so the shaft fills the viewport
  COLS: 15,
  ROWS: 260,
  SKY: 3,                 // rows of air above ground
  GOAL: 10000,            // win at 10,000 $NOMO (matches NOMO max supply)
  START_BAL: 0,
  DIG_DIRT_MS: 230,       // ms to break a dirt tile at surface hardness
  DIG_ROCK_MS: 470,       // ms to break a rock tile at surface hardness
  GRAV_MS: 90,            // ms per tile of falling
  MOVE_MS: 105,           // ms per tile of walking
  CLIMB_MS: 135,          // ms per tile of climbing a shaft

  // depth bands -> [name, riskLabel, tokenChance, redChance, greenChance, gemChance]
  BANDS: [
    { until: 22,  name:"TOPSOIL",    risk:"LOW",      tok:.20, red:.030, grn:.020, gem:.000, hard:1.0 },
    { until: 62,  name:"CLAY SEAM",  risk:"MODERATE", tok:.22, red:.070, grn:.028, gem:.010, hard:1.3 },
    { until:120,  name:"DEEP VAULT", risk:"HIGH",     tok:.24, red:.110, grn:.034, gem:.026, hard:1.7 },
    { until:9999, name:"THE CORE",   risk:"CRITICAL", tok:.26, red:.150, grn:.040, gem:.045, hard:2.1 }
  ]
};

// tile types
const T_AIR=0, T_DIRT=1, T_ROCK=2, T_BED=3;
// contents
const C_NONE=0, C_TOK=1, C_RED=2, C_GRN=3, C_GEM=4;

/* ============================================================
   AUDIO
   Every sound is synthesised at runtime through the Web Audio
   API — no audio files, no network requests, nothing to host.
   Starts silent until the player presses START (browser autoplay
   policy requires a gesture before audio may run).
   ============================================================ */
const Snd = (function(){
  let ac=null, master=null, noiseBuf=null;
  let ready=false, muted=false;

  function init(){
    if(ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.30;
      master.connect(ac.destination);
      // one reusable half-second of white noise for percussive hits
      const len = Math.floor(ac.sampleRate*0.5);
      noiseBuf = ac.createBuffer(1,len,ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
      ready = true;
    }catch(e){ ready = false; }
  }
  function resume(){ try{ if(ac && ac.state==='suspended') ac.resume(); }catch(e){} }
  function live(){ return ready && !muted && ac; }

  // pitched voice with an exponential envelope, optional pitch slide
  function tone(o){
    if(!live()) return;
    try{
      const t0 = ac.currentTime + (o.delay||0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type||'sine';
      osc.frequency.setValueAtTime(o.f, t0);
      if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.to), t0+o.dur);
      const v = o.v==null?.3:o.v;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(v, t0+(o.atk||0.006));
      g.gain.exponentialRampToValueAtTime(0.0001, t0+o.dur);
      osc.connect(g);
      if(o.filter){
        const f = ac.createBiquadFilter();
        f.type='lowpass'; f.frequency.value=o.filter;
        g.connect(f); f.connect(master);
      } else g.connect(master);
      osc.start(t0); osc.stop(t0+o.dur+0.02);
    }catch(e){}
  }

  // filtered noise burst for impacts
  function noise(o){
    if(!live()) return;
    try{
      const t0 = ac.currentTime + (o.delay||0);
      const src = ac.createBufferSource(); src.buffer = noiseBuf;
      const f = ac.createBiquadFilter();
      f.type = o.ftype||'bandpass';
      f.frequency.setValueAtTime(o.f||800, t0);
      if(o.to) f.frequency.exponentialRampToValueAtTime(Math.max(20,o.to), t0+o.dur);
      f.Q.value = o.q==null?1:o.q;
      const g = ac.createGain();
      const v = o.v==null?.3:o.v;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(v, t0+(o.atk||0.004));
      g.gain.exponentialRampToValueAtTime(0.0001, t0+o.dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0); src.stop(t0+o.dur+0.02);
    }catch(e){}
  }

  return {
    init, resume,
    toggle(){ muted = !muted; return muted; },
    isMuted(){ return muted; },

    click(){ tone({f:520,to:760,dur:.07,type:'square',v:.16}); },
    step(){  noise({f:520,dur:.045,v:.05,q:1.2}); },

    // pick striking rock, looped while a tile is being broken
    dig(){   noise({f:340,to:190,dur:.075,v:.13,q:1.1});
             tone({f:120,to:80,dur:.06,type:'sine',v:.10}); },
    brk(){   noise({f:900,to:220,dur:.16,v:.20,q:.8});
             tone({f:150,to:60,dur:.14,type:'sine',v:.17}); },
    land(){  noise({f:260,to:110,dur:.11,v:.13,q:1});
             tone({f:100,to:55,dur:.12,type:'sine',v:.15}); },

    // rewards climb in brightness with value
    token(){ tone({f:700,to:1050,dur:.10,type:'triangle',v:.20});
             tone({f:1400,dur:.05,type:'sine',v:.07,delay:.02}); },
    gem(){   [880,1320,1760].forEach((f,i)=> tone({f:f,dur:.30,type:'triangle',v:.15,delay:i*.05}));
             tone({f:2640,dur:.20,type:'sine',v:.06,delay:.12}); },
    green(){ [523,659,784,1046].forEach((f,i)=> tone({f:f,dur:.16,type:'square',v:.11,delay:i*.045,filter:2600})); },
    mult(){  tone({f:880,dur:.09,type:'triangle',v:.16});
             tone({f:1320,dur:.12,type:'triangle',v:.16,delay:.07}); },

    // losses fall instead of rise, and get dirtier
    red(){   tone({f:240,to:55,dur:.42,type:'sawtooth',v:.24,filter:1200});
             noise({f:1400,to:180,dur:.30,v:.16,q:.7});
             tone({f:110,to:44,dur:.36,type:'square',v:.14,delay:.03,filter:700}); },
    dump(){  tone({f:300,to:40,dur:.75,type:'sawtooth',v:.26,filter:1000});
             noise({f:1800,to:120,dur:.60,v:.19,q:.6});
             tone({f:90,to:36,dur:.70,type:'square',v:.16,delay:.05,filter:600});
             tone({f:200,to:50,dur:.50,type:'sawtooth',v:.14,delay:.18,filter:900}); },

    win(){   [523,659,784,1046,1319].forEach((f,i)=> tone({f:f,dur:.5,type:'triangle',v:.18,delay:i*.11}));
             tone({f:2093,dur:.7,type:'sine',v:.10,delay:.55}); },
    over(){  [440,392,330,262].forEach((f,i)=> tone({f:f,dur:.35,type:'triangle',v:.15,delay:i*.12})); }
  };
})();

/* ============================================================
   STATE
   ============================================================ */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let DPR = Math.min(window.devicePixelRatio||1, 2);
let VW=0, VH=0;

let world = null;
let P = null;
let cam = {x:0,y:0,tx:0,ty:0};
let bal=0, maxDepth=0, streak=0, mult=1, digs=0, redHits=0;
let particles=[], floaters=[], shake=0, flashCol=null, flashA=0;
let state='menu';
let lastT=0, acc=0;
let held={left:false,right:false,up:false,down:false};
let marketTimer=0;

/* ============================================================
   WORLD GEN
   ============================================================ */
function bandAt(row){
  const d = Math.max(0, row - CFG.SKY);
  for(const b of CFG.BANDS) if(d < b.until) return b;
  return CFG.BANDS[CFG.BANDS.length-1];
}

function genWorld(){
  world = [];
  for(let r=0;r<CFG.ROWS;r++){
    const row = [];
    const b = bandAt(r);
    for(let c=0;c<CFG.COLS;c++){
      let t=T_DIRT, content=C_NONE;

      if(r < CFG.SKY){ t=T_AIR; }
      else if(r === CFG.ROWS-1){ t=T_BED; }
      else if(c===0 || c===CFG.COLS-1){ t=T_BED; }        // side walls
      else {
        // rock pockets get commoner with depth
        const rockChance = Math.min(.34, .05 + (r-CFG.SKY)*.0016);
        t = Math.random() < rockChance ? T_ROCK : T_DIRT;

        const roll = Math.random();
        let acc = 0;
        acc += b.tok; if(roll < acc) content = C_TOK;
        else { acc += b.red; if(roll < acc) content = C_RED;
        else { acc += b.grn; if(roll < acc) content = C_GRN;
        else { acc += b.gem; if(roll < acc) content = C_GEM; }}}
      }
      row.push({t:t, c:content, dug:0, seed:Math.random()});
    }
    world.push(row);
  }
  // carve a clean starting shaft so the first move always works
  const mid = (CFG.COLS/2)|0;
  world[CFG.SKY][mid] = {t:T_AIR,c:C_NONE,dug:0,seed:.5};
  for(let c=1;c<CFG.COLS-1;c++){
    if(world[CFG.SKY][c].c===C_RED) world[CFG.SKY][c].c=C_NONE;
  }
}

function tile(r,c){
  if(r<0||r>=CFG.ROWS||c<0||c>=CFG.COLS) return null;
  return world[r][c];
}
function solid(r,c){
  const t = tile(r,c);
  if(!t) return true;
  return t.t !== T_AIR;
}

/* ============================================================
   PLAYER
   ============================================================ */
function newPlayer(){
  return {
    r: CFG.SKY, c:(CFG.COLS/2)|0,
    px:0, py:0,                 // render pixel pos
    fromX:0, fromY:0, toX:0, toY:0,
    tween:1, tweenDur:1,
    facing:1,
    digging:null,               // {r,c,prog,need}
    anim:0, bob:0,
    falling:false
  };
}
function pxOf(p){ return {x:p.c*CFG.TILE, y:p.r*CFG.TILE}; }

function startMove(p, nr, nc, dur){
  const from = {x:p.px, y:p.py};
  p.fromX=from.x; p.fromY=from.y;
  p.toX=nc*CFG.TILE; p.toY=nr*CFG.TILE;
  p.r=nr; p.c=nc;
  p.tween=0; p.tweenDur=dur;
}

/* ============================================================
   CONTENT PAYOUTS
   ============================================================ */
function payout(kind, row){
  const d = Math.max(1, row-CFG.SKY);
  const depthScale = 1 + d*0.035;
  switch(kind){
    case C_TOK: return Math.round((12 + Math.random()*16) * depthScale * mult);
    case C_GEM: return Math.round((70 + Math.random()*90) * depthScale * mult);
    case C_GRN: return Math.round((30 + Math.random()*35) * depthScale * mult);
    // losses scale slower than gains so a red candle stings without stalling the run
    case C_RED: return -Math.round((14 + Math.random()*24) * (1 + d*0.028));
  }
  return 0;
}

function collect(t, r, c){
  if(t.c === C_NONE) return;
  const kind = t.c;
  t.c = C_NONE;
  const cx = c*CFG.TILE + CFG.TILE/2;
  const cy = r*CFG.TILE + CFG.TILE/2;

  if(kind === C_RED){
    const amt = payout(C_RED, r);
    bal = Math.max(0, bal + amt);
    streak = 0; mult = 1; redHits++;
    shake = Math.max(shake, 15);
    flashCol = '#FF3B3B'; flashA = .5;
    Snd.red();
    floaters.push({x:cx,y:cy,vy:-.55,life:1,txt:amt+" $NOMO",col:'#FF3B3B',big:true});
    floaters.push({x:cx,y:cy+20,vy:-.42,life:1,txt:"RED CANDLE",col:'#FF6B6B',big:false});
    burst(cx,cy,'#FF3B3B',26);
    return;
  }

  streak++;
  if(streak>0 && streak%8===0){ mult = Math.min(3, +(mult+0.5).toFixed(1));
    Snd.mult();
    floaters.push({x:cx,y:cy-26,vy:-.4,life:1.2,txt:"MULT "+mult+"x",col:'#00E676',big:false}); }

  const amt = payout(kind, r);
  bal += amt;

  if(kind===C_TOK){
    Snd.token();
    floaters.push({x:cx,y:cy,vy:-.5,life:.9,txt:"+"+amt,col:'#C6FF00',big:false});
    burst(cx,cy,'#C6FF00',12);
  } else if(kind===C_GEM){
    Snd.gem();
    floaters.push({x:cx,y:cy,vy:-.55,life:1.2,txt:"+"+amt+" VAULT GEM",col:'#00E5FF',big:true});
    burst(cx,cy,'#00E5FF',24); shake=Math.max(shake,6);
    flashCol='#00E5FF'; flashA=.22;
  } else if(kind===C_GRN){
    Snd.green();
    floaters.push({x:cx,y:cy,vy:-.55,life:1.1,txt:"+"+amt+" GREEN CANDLE",col:'#00E676',big:true});
    burst(cx,cy,'#00E676',20);
    flashCol='#00E676'; flashA=.2;
  }
}

/* ============================================================
   EFFECTS
   ============================================================ */
function burst(x,y,col,n){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = .6+Math.random()*3.1;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.8,life:1,col,sz:1.5+Math.random()*3});
  }
}
function dust(x,y,col){
  for(let i=0;i<7;i++){
    const a=Math.random()*Math.PI*2, sp=.3+Math.random()*1.5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.5,life:.7,col,sz:1+Math.random()*2.4});
  }
}

});
addEventListener('keyup', e=>{ const k=KEYMAP[e.code]; if(k){ held[k]=false; e.preventDefault(); } });

// click / tap a neighbouring tile to dig toward it
let tapDir=null, tapTimer=0;
cv.addEventListener('pointerdown', e=>{
  if(state!=='play') return;
  const rect = cv.getBoundingClientRect();
  const wx = (e.clientX-rect.left)*(VW/rect.width) + cam.x;
  const wy = (e.clientY-rect.top)*(VH/rect.height) + cam.y;
  const tc = Math.floor(wx/CFG.TILE), tr = Math.floor(wy/CFG.TILE);
  const dc = tc-P.c, dr = tr-P.r;
  if(Math.abs(dc)+Math.abs(dr)!==1) return;
  if(dc===-1) tapDir='left'; else if(dc===1) tapDir='right';
  else if(dr===-1) tapDir='up'; else if(dr===1) tapDir='down';
  tapTimer = 160;
});

function wantedDir(){
  if(held.left) return 'left';
  if(held.right) return 'right';
  if(held.down) return 'down';
  if(held.up) return 'up';
  if(tapTimer>0) return tapDir;
  return null;
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt){
  if(state!=='play') return;
  if(tapTimer>0) tapTimer -= dt;

  const p = P;
  p.anim += dt;

  // ---- tween in progress ----
  if(p.tween < 1){
    p.tween += dt / p.tweenDur;
    if(p.tween>=1){
      p.tween=1;
      p.px=p.toX; p.py=p.toY;
      const wasFalling = p.falling;
      const t = tile(p.r,p.c);
      if(t) collect(t,p.r,p.c);
      // thud only when the fall actually ends, not on every tile passed through
      if(wasFalling && solid(p.r+1,p.c)) Snd.land();
    } else {
      const e = p.tween<.5 ? 2*p.tween*p.tween : 1-Math.pow(-2*p.tween+2,2)/2;
      p.px = p.fromX + (p.toX-p.fromX)*e;
      p.py = p.fromY + (p.toY-p.fromY)*e;
    }
    return;
  }

  // ---- bracing ----
  // A wall on either side means NOMO can grip it, so a shaft you dug yourself
  // is climbable both ways. Open caverns have nothing to hold: you fall.
  const braced = solid(p.r, p.c-1) || solid(p.r, p.c+1);

  // ---- gravity ----
  if(!solid(p.r+1, p.c) && !p.digging && !braced){
    p.falling = true;
    startMove(p, p.r+1, p.c, CFG.GRAV_MS);
    return;
  }
  p.falling = false;

  // ---- dig in progress ----
  if(p.digging){
    const d = p.digging;
    const t = tile(d.r,d.c);
    if(!t || t.t===T_AIR || t.t===T_BED){ p.digging=null; }
    else {
      d.prog += dt;
      t.dug = Math.min(1, d.prog/d.need);
      // pick strikes on a fixed cadence rather than every frame
      d.sndT -= dt;
      if(d.sndT <= 0){ Snd.dig(); d.sndT = 125; }
      if(Math.random()<.28){
        dust(d.c*CFG.TILE+CFG.TILE/2, d.r*CFG.TILE+CFG.TILE/2, t.t===T_ROCK?'#6b6a63':'#7a5f3c');
      }
      if(d.prog >= d.need){
        t.t = T_AIR; t.dug=0; digs++;
        dust(d.c*CFG.TILE+CFG.TILE/2, d.r*CFG.TILE+CFG.TILE/2, '#8a6a42');
        Snd.brk();
        p.digging = null;
        startMove(p, d.r, d.c, CFG.MOVE_MS);
      }
      return;
    }
  }

  // ---- take a new action ----
  const dir = wantedDir();
  if(!dir) return;
  let nr=p.r, nc=p.c;
  if(dir==='left'){ nc--; p.facing=-1; }
  else if(dir==='right'){ nc++; p.facing=1; }
  else if(dir==='up'){ nr--; }
  else if(dir==='down'){ nr++; }

  const t = tile(nr,nc);
  if(!t) return;

  if(t.t===T_BED) return;                    // undiggable

  if(t.t===T_AIR){
    if(dir==='up'){
      // need something to grip or push off before climbing
      if(!braced && !solid(p.r+1,p.c)) return;
      Snd.step();
      startMove(p, nr, nc, CFG.CLIMB_MS);
    } else {
      Snd.step();
      startMove(p, nr, nc, CFG.MOVE_MS);
    }
  } else {
    const b = bandAt(nr);
    const need = (t.t===T_ROCK ? CFG.DIG_ROCK_MS : CFG.DIG_DIRT_MS) * b.hard;
    p.digging = {r:nr,c:nc,prog:0,need:need,sndT:0};
  }
}

function updateFX(dt){
  // particles
  for(let i=particles.length-1;i>=0;i--){
    const q=particles[i];
    q.x+=q.vx*dt*.06; q.y+=q.vy*dt*.06; q.vy+=dt*.012;
    q.life -= dt*.0026;
    if(q.life<=0) particles.splice(i,1);
  }
  // floating text
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];
    f.y += f.vy*dt*.06; f.life -= dt*.0013;
    if(f.life<=0) floaters.splice(i,1);
  }
  if(shake>0) shake = Math.max(0, shake - dt*.05);
  if(flashA>0) flashA = Math.max(0, flashA - dt*.0022);

  // random market dump — a red candle can hit even without digging one
  if(state==='play'){
    marketTimer -= dt;
    if(marketTimer<=0){
      marketTimer = 14000 + Math.random()*17000;
      if(bal > 180 && Math.random() < .55){
        const amt = -Math.round(bal * (0.04 + Math.random()*0.07));
        bal = Math.max(0, bal+amt);
        streak=0; mult=1;
        shake=Math.max(shake,20); flashCol='#FF3B3B'; flashA=.55;
        Snd.dump();
        const cx=P.px+CFG.TILE/2, cy=P.py-10;
        floaters.push({x:cx,y:cy,vy:-.5,life:1.5,txt:"MARKET DUMP "+amt,col:'#FF3B3B',big:true});
        burst(cx,cy,'#FF3B3B',34);
      }
    }
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function resize(){
  const r = cv.getBoundingClientRect();
  VW = Math.round(r.width); VH = Math.round(r.height);
  DPR = Math.min(window.devicePixelRatio||1, 2);
  cv.width = VW*DPR; cv.height = VH*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled = false;

  // Scale tiles so the shaft spans the viewport instead of leaving dead space.
  CFG.TILE = Math.max(34, Math.min(96, Math.round(VW / CFG.COLS)));

  // Re-anchor the player to its grid cell at the new scale.
  if(P){
    P.px = P.c*CFG.TILE; P.py = P.r*CFG.TILE;
    P.toX = P.px; P.toY = P.py; P.tween = 1; P.digging = null;
    cam.x = P.px+CFG.TILE/2-VW/2; cam.y = P.py+CFG.TILE/2-VH/2;
  }
}
addEventListener('resize', resize);

function dirtColour(r, seed){
  const d = Math.max(0, r-CFG.SKY);
  // interpolate through the band palette as you descend
  const stops = [
    [0,   [107,83,53]],
    [22,  [90,69,41]],
    [62,  [74,58,40]],
    [120, [56,52,46]],
    [200, [40,34,46]],
    [260, [30,26,38]]
  ];
  let a=stops[0], b=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){
    if(d>=stops[i][0] && d<=stops[i+1][0]){ a=stops[i]; b=stops[i+1]; break; }
  }
  const t = (d-a[0])/Math.max(1,(b[0]-a[0]));
  const v = seed*16-8;
  return `rgb(${(a[1][0]+(b[1][0]-a[1][0])*t+v)|0},${(a[1][1]+(b[1][1]-a[1][1])*t+v)|0},${(a[1][2]+(b[1][2]-a[1][2])*t+v)|0})`;
}

function draw(){
  const T = CFG.TILE;

  // camera follows player, clamped
  const worldW = CFG.COLS*T;
  cam.tx = P.px + T/2 - VW/2;
  cam.ty = P.py + T/2 - VH/2;
  // if the shaft is narrower than the viewport, centre it rather than left-align
  cam.tx = worldW <= VW ? (worldW - VW)/2
                        : Math.max(0, Math.min(worldW - VW, cam.tx));
  cam.ty = Math.max(-CFG.SKY*T - 40, Math.min(CFG.ROWS*T - VH, cam.ty));
  cam.x += (cam.tx-cam.x)*.12;
  cam.y += (cam.ty-cam.y)*.12;

  const sx = shake>0 ? (Math.random()-.5)*shake : 0;
  const sy = shake>0 ? (Math.random()-.5)*shake : 0;

  ctx.clearRect(0,0,VW,VH);

  // ---- sky gradient behind everything ----
  const skyBottom = (CFG.SKY*T - cam.y);
  if(skyBottom > 0){
    const g = ctx.createLinearGradient(0,0,0,Math.max(1,skyBottom));
    g.addColorStop(0,'#0a1408'); g.addColorStop(1,'#141d0d');
    ctx.fillStyle=g; ctx.fillRect(0,0,VW,skyBottom);
  }
  ctx.fillStyle='#060806';
  ctx.fillRect(0,Math.max(0,skyBottom),VW,VH-Math.max(0,skyBottom));

  ctx.save();
  ctx.translate(-cam.x+sx, -cam.y+sy);

  const c0 = Math.max(0, Math.floor(cam.x/T)-1);
  const c1 = Math.min(CFG.COLS-1, Math.ceil((cam.x+VW)/T)+1);
  const r0 = Math.max(0, Math.floor(cam.y/T)-1);
  const r1 = Math.min(CFG.ROWS-1, Math.ceil((cam.y+VH)/T)+1);

  // ---- tiles ----
  for(let r=r0;r<=r1;r++){
    for(let c=c0;c<=c1;c++){
      const t = world[r][c];
      const x=c*T, y=r*T;

      if(t.t===T_AIR){
        // dug tunnel — darker void with a soft inner edge
        ctx.fillStyle='#0b0e0a';
        ctx.fillRect(x,y,T,T);
        continue;
      }

      if(t.t===T_BED){
        ctx.fillStyle='#1b1e19';
        ctx.fillRect(x,y,T,T);
        ctx.strokeStyle='rgba(198,255,0,.10)';
        ctx.lineWidth=1;
        ctx.strokeRect(x+.5,y+.5,T-1,T-1);
        // hazard hatching
        ctx.strokeStyle='rgba(198,255,0,.06)';
        for(let i=-T;i<T;i+=8){
          ctx.beginPath(); ctx.moveTo(x+i,y); ctx.lineTo(x+i+T,y+T); ctx.stroke();
        }
        continue;
      }

      // dirt / rock body
      ctx.fillStyle = t.t===T_ROCK ? `rgb(${(72+t.seed*18)|0},${(70+t.seed*18)|0},${(66+t.seed*18)|0})`
                                   : dirtColour(r, t.seed);
      ctx.fillRect(x,y,T,T);

      // speckle texture
      ctx.fillStyle='rgba(0,0,0,.16)';
      const n = t.t===T_ROCK?3:5;
      for(let i=0;i<n;i++){
        const px = x + ((t.seed*(i+3)*97)%1)*T;
        const py = y + ((t.seed*(i+7)*61)%1)*T;
        const s = 2 + ((t.seed*(i+1)*13)%1)*3;
        ctx.fillRect(px|0,py|0,s,s);
      }
      // top highlight if exposed
      if(!solid(r-1,c)){
        ctx.fillStyle='rgba(255,255,255,.07)';
        ctx.fillRect(x,y,T,3);
      }
      // subtle grid seam
      ctx.strokeStyle='rgba(0,0,0,.28)';
      ctx.lineWidth=1;
      ctx.strokeRect(x+.5,y+.5,T-1,T-1);

      // Buried deposit. You can see SOMETHING is there, but not what it is
      // until you've broken into it — so every dig is a small gamble.
      if(t.c!==C_NONE){
        if(t.dug < .3){
          ctx.fillStyle='rgba(0,0,0,.20)';
          ctx.beginPath(); ctx.arc(x+T/2,y+T/2,T*.105,0,7); ctx.fill();
          ctx.fillStyle='rgba(222,230,196,'+(0.11+t.dug*0.35)+')';
          ctx.beginPath(); ctx.arc(x+T/2,y+T/2,T*.082,0,7); ctx.fill();
          ctx.fillStyle='rgba(255,255,255,.14)';
          ctx.beginPath(); ctx.arc(x+T/2-T*.026,y+T/2-T*.026,T*.03,0,7); ctx.fill();
        } else {
          const col = t.c===C_RED?'rgba(255,59,59,':t.c===C_GRN?'rgba(0,230,118,':
                      t.c===C_GEM?'rgba(0,229,255,':'rgba(198,255,0,';
          ctx.fillStyle = col + Math.min(.9,(t.dug-.3)*1.3+.3) + ')';
          ctx.beginPath(); ctx.arc(x+T/2,y+T/2,T*.13+t.dug*T*.09,0,7); ctx.fill();
        }
      }

      // dig cracks
      if(t.dug>0){
        ctx.strokeStyle=`rgba(0,0,0,${.25+t.dug*.5})`;
        ctx.lineWidth=1.6;
        const cx=x+T/2, cy=y+T/2, len=t.dug*T*.46;
        for(let a=0;a<5;a++){
          const ang = t.seed*6.28 + a*1.256;
          ctx.beginPath(); ctx.moveTo(cx,cy);
          ctx.lineTo(cx+Math.cos(ang)*len, cy+Math.sin(ang)*len);
          ctx.stroke();
        }
      }
    }
  }

  // ---- surface grass line ----
  const gy = CFG.SKY*T;
  if(gy > cam.y-T && gy < cam.y+VH+T){
    ctx.fillStyle='#4f7a1e';
    ctx.fillRect(c0*T, gy-6, (c1-c0+1)*T, 6);
    ctx.fillStyle='#66a028';
    ctx.fillRect(c0*T, gy-6, (c1-c0+1)*T, 2);
  }

  // ---- exposed contents sitting in open tunnels ----
  for(let r=r0;r<=r1;r++){
    for(let c=c0;c<=c1;c++){
      const t=world[r][c];
      if(t.t!==T_AIR || t.c===C_NONE) continue;
      drawContent(t.c, c*T+T/2, r*T+T/2, T);
    }
  }

  // ---- particles ----
  for(const q of particles){
    ctx.globalAlpha = Math.max(0,q.life);
    ctx.fillStyle=q.col;
    ctx.fillRect(q.x-q.sz/2, q.y-q.sz/2, q.sz, q.sz);
  }
  ctx.globalAlpha=1;

  // ---- player ----
  drawGnome(P.px, P.py, T);

  // ---- floating text ----
  for(const f of floaters){
    ctx.globalAlpha = Math.max(0, Math.min(1,f.life));
    ctx.fillStyle=f.col;
    ctx.font = (f.big?'bold 15px ':'bold 12px ')+'ui-monospace,monospace';
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.shadowColor=f.col; ctx.shadowBlur=10;
    ctx.fillText(f.txt, f.x, f.y);
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // ---- full-screen flash ----
  if(flashA>0){
    ctx.fillStyle=flashCol;
    ctx.globalAlpha=flashA;
    ctx.fillRect(0,0,VW,VH);
    ctx.globalAlpha=1;
  }
}

/* ---- collectible art ---- */
function drawContent(kind, cx, cy, T){
  const t = performance.now()*.003;
  const bobY = Math.sin(t + cx*.05)*2;
  ctx.save();
  ctx.translate(cx, cy+bobY);

  if(kind===C_TOK){
    // NOMO token — lime coin with N
    ctx.shadowColor='#C6FF00'; ctx.shadowBlur=14;
    ctx.fillStyle='#C6FF00';
    ctx.beginPath(); ctx.arc(0,0,T*.20,0,7); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#0a0d08';
    ctx.font='bold '+(T*.24|0)+'px ui-monospace,monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('N',0,1);
  }
  else if(kind===C_GEM){
    ctx.shadowColor='#00E5FF'; ctx.shadowBlur=16;
    ctx.fillStyle='#00E5FF';
    ctx.beginPath();
    ctx.moveTo(0,-T*.22); ctx.lineTo(T*.19,0); ctx.lineTo(0,T*.22); ctx.lineTo(-T*.19,0);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.moveTo(0,-T*.22); ctx.lineTo(T*.19,0); ctx.lineTo(0,0); ctx.closePath(); ctx.fill();
  }
  else if(kind===C_RED || kind===C_GRN){
    // candlestick — the crypto tell
    const col = kind===C_RED ? '#FF3B3B' : '#00E676';
    const h = T*.30, w = T*.17;
    ctx.shadowColor=col; ctx.shadowBlur=13;
    ctx.strokeStyle=col; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,-h*1.5); ctx.lineTo(0,h*1.5); ctx.stroke();
    ctx.fillStyle=col;
    ctx.fillRect(-w/2,-h*.75,w,h*1.5);
    ctx.shadowBlur=0;
    // arrow direction
    ctx.fillStyle= kind===C_RED?'#7a0d0d':'#00532a';
    ctx.font='bold '+(T*.17|0)+'px ui-monospace,monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(kind===C_RED?'▼':'▲',0,0);
  }
  ctx.restore();
}

function drawGnome(x, y, T){
  const p = P;
  const cx = x + T/2;
  const cy = y + T;                     // feet on the tile floor
  const digging = !!p.digging;
  const a = p.anim;
  const bob = digging ? Math.abs(Math.sin(a*.02))*T*0.06 : (p.tween<1&&!p.falling ? Math.abs(Math.sin(a*.03))*T*0.02 : 0);

  // frame: strike on the down phase of the swing, raised otherwise
  let img = _NIMG.a;
  if(digging && Math.sin(a*.02) > 0.15) img = _NIMG.b;

  ctx.save();
  ctx.translate(cx, cy - bob);
  ctx.scale(p.facing, 1);
  // ground shadow
  ctx.fillStyle='rgba(0,0,0,.5)';
  ctx.beginPath(); ctx.ellipse(0, bob, T*0.27, T*0.08, 0, 0, 7); ctx.fill();

  if(_NIMG.ready && img && img.complete && img.naturalHeight){
    const H = T*1.6, W = H * (img.naturalWidth/img.naturalHeight);
    const prev = ctx.imageSmoothingEnabled;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(img, -W/2, -H, W, H);
    ctx.imageSmoothingEnabled = prev;
  } else {
    // fallback blob until the sprite decodes — keeps the game playable
    ctx.fillStyle='#9ADB0E';
    ctx.fillRect(-T*0.2, -T, T*0.4, T);
  }
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ============================================================
   HUD
   ============================================================ */
const el = {
  bal: document.getElementById('balnum'),
  fill: document.getElementById('balfill'),
  depth: document.getElementById('depth'),
  sector: document.getElementById('sector'),
  lvl: document.getElementById('c-lvl'),
  streak: document.getElementById('c-streak'),
  risk: document.getElementById('c-risk'),
  pick: document.getElementById('c-pick'),
  ov: document.getElementById('ov'),
  card: document.getElementById('card')
};

const sndBtn = document.getElementById('sndbtn');
function syncSndBtn(){
  const m = Snd.isMuted();
  sndBtn.textContent = m ? '♪ SOUND OFF' : '♪ SOUND ON';
  sndBtn.classList.toggle('off', m);
  sndBtn.setAttribute('aria-pressed', String(m));
}
sndBtn.addEventListener('click', e=>{
  e.stopPropagation();
  Snd.init(); Snd.resume();
  const m = Snd.toggle();
  if(!m) Snd.click();          // confirm audibly when turning sound back on
  syncSndBtn();
});

function syncHUD(){
  const d = Math.max(0, P.r - CFG.SKY);
  maxDepth = Math.max(maxDepth, d);
  const b = bandAt(P.r);

  el.bal.innerHTML = bal.toLocaleString() + ' <small>/ 10,000 $NOMO</small>';
  el.fill.style.width = Math.min(100, bal/CFG.GOAL*100) + '%';
  el.depth.textContent = d + 'm';
  el.sector.textContent = 'GN-' + String(Math.min(99, 10 + Math.floor(d/12))).padStart(2,'0');

  el.lvl.querySelector('b').textContent = b.name;
  el.streak.querySelector('b').textContent = streak + 'x  ·  ' + mult + '×';
  el.streak.classList.toggle('on', streak>0);
  el.risk.querySelector('b').textContent = b.risk;
  el.risk.className = 'cell ' + (b.risk==='CRITICAL'||b.risk==='HIGH' ? 'bad' : 'on');
  const pk = d<22?'MK-I':d<62?'MK-II':d<120?'MK-III':'MK-IV';
  el.pick.querySelector('b').textContent = pk;
  el.pick.classList.add('on');
}

/* ============================================================
   SCREENS
   ============================================================ */
function showMenu(){
  state='menu';
  el.ov.classList.remove('hide');
  el.card.innerHTML = `
    <img id="menuGno" alt="" style="width:104px;height:auto;image-rendering:auto;filter:drop-shadow(0 0 16px rgba(198,255,0,.55));margin:2px auto 8px;display:block">
    <div class="eyebrow">SECURE ACCESS NODE</div>
    <h1>SUBLEVEL DIG</h1>
    <div class="sub">
      NOMO guards a vault of exactly <b>10,000</b>.<br>
      Dig down, pull tokens out of the rock, and bank the full supply.<br><br>
      <span style="color:#FF3B3B">RED CANDLES</span> are buried in the dirt.
      Break one and it drains your balance.<br>
      <span style="color:#00E676">GREEN CANDLES</span> pay out. Gems pay more.
    </div>
    <div class="keys">
      <div class="key"><b>W A S D</b> / <b>ARROWS</b> — move &amp; dig</div>
      <div class="key"><b>CLICK</b> a tile — dig toward it</div>
    </div>
    <button id="go">START DIG</button>`;
  document.getElementById('go').onclick = startGame;
  var _mg=document.getElementById('menuGno'); if(_mg && _NIMG.a.src){ _mg.src=_NIMG.a.src; }
}

function endGame(win){
  state = win ? 'win' : 'over';
  if(win) Snd.win(); else Snd.over();
  el.ov.classList.remove('hide');
  const acc = digs>0 ? Math.round((1-redHits/Math.max(1,digs))*100) : 100;
  el.card.innerHTML = `
    <div class="eyebrow">${win?'AUTHORIZATION GRANTED':'RUN TERMINATED'}</div>
    <h1 class="small">${win?'VAULT SECURED':'SURFACED'}</h1>
    <div class="sub">${win
      ? 'Full 10,000 supply recovered. NOMO approves.'
      : 'You climbed out with what you had.'}</div>
    <div class="statrow">
      <div class="stat"><span class="n">${bal.toLocaleString()}</span><span class="k">$NOMO</span></div>
      <div class="stat"><span class="n">${maxDepth}m</span><span class="k">MAX DEPTH</span></div>
      <div class="stat ${redHits>0?'warn':''}"><span class="n">${redHits}</span><span class="k">RED CANDLES</span></div>
    </div>
    <button id="go">${win?'DIG AGAIN':'RETRY'}</button>`;
  document.getElementById('go').onclick = startGame;
}

function startGame(){
  // audio can only be created off a real user gesture
  Snd.init(); Snd.resume(); Snd.click();
  syncSndBtn();
  genWorld();
  P = newPlayer();
  const s = pxOf(P); P.px=s.x; P.py=s.y; P.toX=s.x; P.toY=s.y; P.tween=1;
  cam.x = P.px+CFG.TILE/2-VW/2; cam.y = P.py+CFG.TILE/2-VH/2;
  bal=CFG.START_BAL; maxDepth=0; streak=0; mult=1; digs=0; redHits=0;
  particles=[]; floaters=[]; shake=0; flashA=0;
  marketTimer = 20000;
  held={left:false,right:false,up:false,down:false}; tapTimer=0;
  el.ov.classList.add('hide');
  state='play';
}

/* ============================================================
   LOOP
   ============================================================ */
function frame(now){
  const dt = Math.min(50, now - (lastT||now));
  lastT = now;

  update(dt);
  updateFX(dt);
  if(P) { draw(); syncHUD(); }

  if(state==='play' && bal >= CFG.GOAL) endGame(true);

  requestAnimationFrame(frame);
}

/* ============================================================
   BOOT
   ============================================================ */
resize();
genWorld();
P = newPlayer();
const s0 = pxOf(P); P.px=s0.x; P.py=s0.y; P.toX=s0.x; P.toY=s0.y;
cam.x = P.px+CFG.TILE/2-VW/2; cam.y = P.py+CFG.TILE/2-VH/2;
showMenu();
requestAnimationFrame(frame);

/* ============================================================
   SWAP-IN NOTE — using real NOMO sprite art
   ------------------------------------------------------------
   The gnome is drawn with canvas vectors in drawGnome() so this
   file has zero external dependencies. To use real sprites:

     const nomo = new Image();
     nomo.src = '/assets/nomo-sprite.png';   // your own file

   then replace the body of drawGnome(x,y,T) with:

     ctx.save();
     ctx.translate(x+T/2, y+T);
     ctx.scale(P.facing,1);
     ctx.drawImage(nomo, -T/2, -T*1.15, T, T*1.15);
     ctx.restore();

   Everything else (physics, digging, payouts) is untouched.
   ============================================================ */
})();
